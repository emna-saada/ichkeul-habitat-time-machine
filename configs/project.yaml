# Ichkeul Habitat Time Machine — project configuration
aoi:
  name: Ichkeul National Park + buffer
  centre_lonlat: [9.665, 37.150]
  crs: EPSG:32632
  resolution: 10
  chip_size: 224          # pixels (2.24 km)
  chips_x: 10             # AOI width  = 10 chips = 22.4 km
  chips_y: 8              # AOI height =  8 chips = 17.92 km
sentinel2:
  bucket: https://sentinel-cogs.s3.us-west-2.amazonaws.com
  prefix: sentinel-s2-l2a-cogs
  mgrs: [32, S, NG]
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  prithvi_bands: [B02, B03, B04, B8A, B11, B12]
  max_tile_cloud: 95
  min_aoi_clear: 0.35
  max_scenes_per_season: 10
  keep_single_dates: 3
years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
seasons:
  wet: [1, 2, 3]
  dry: [7, 8, 9]
classes:
  - {id: 0, key: perm_water,   name: Permanent open water,          color: "#1D4E89"}
  - {id: 1, key: seas_water,   name: Seasonal shallow water,        color: "#7FB3D5"}
  - {id: 2, key: fresh_marsh,  name: Freshwater emergent marsh,     color: "#3C8D5A"}
  - {id: 3, key: halo_marsh,   name: Halophytic marsh,              color: "#B5523B"}
  - {id: 4, key: saline_flat,  name: Bare saline flat / mudflat,    color: "#E6D5A8"}
  - {id: 5, key: crop_grass,   name: Cropland & grassland,          color: "#B9B46C"}
  - {id: 6, key: shrub_wood,   name: Shrub & woodland,              color: "#1F4A2C"}
  - {id: 7, key: built,        name: Built & roads,                 color: "#5E5A57"}
ignore_index: -1
split: {block_m: 1120, train: 0.70, val: 0.15, test: 0.15, seed: 42}
